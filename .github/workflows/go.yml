name: Go

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -tags goolm ./...
      - run: go vet -tags goolm ./...

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      matrix:
        include:
          - { os: macos-latest, name: darwin-arm64 }
          - { os: ubuntu-latest, name: linux-amd64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build.sh && mv bipe-beeper bipe-beeper-${{ matrix.name }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --generate-notes 2>/dev/null || true; gh release upload ${{ github.ref_name }} bipe-beeper-${{ matrix.name }} --clobber

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/bipe-chat/bipe-beeper:${{ github.ref_name }},ghcr.io/bipe-chat/bipe-beeper:latest
